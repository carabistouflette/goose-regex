name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev pkg-config clang
      - run: make setup
      - run: make check test test-debug
      - run: make sanitize CC=clang
      - run: make sanitize CC=gcc
      - run: make fuzz FUZZ_RUNS=10000
      - run: make bench
      - run: make test-minimum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.sha }}
          path: .build/benchmark.json
          include-hidden-files: true
          if-no-files-found: error
